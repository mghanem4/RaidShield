services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    volumes:
      - raidshield-data:/app/backend/data
    ports:
      - "127.0.0.1:8000:8000"
  frontend:
    build:
      context: frontend
    depends_on: [backend]
    ports:
      - "127.0.0.1:5173:80"
volumes:
  raidshield-data:

