[project]
name = "raidshield"
version = "0.1.0"
description = "Safety-first coordination indicator MVP"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.30,<0.35",
  "pydantic-settings>=2.5,<2.11",
  "sqlalchemy>=2.0.32,<2.1",
  "alembic>=1.13,<1.15",
  "cryptography>=43,<45",
  "scikit-learn>=1.5,<1.7",
  "python-multipart>=0.0.12,<0.1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<0.29",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app.detection --cov=app.services.ingestion --cov-report=term-missing --cov-fail-under=80"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
strict = true
ignore_missing_imports = true
exclude = ["alembic"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
